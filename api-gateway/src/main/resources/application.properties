spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# ======================================
# JWT Configuration (MUST match user-service)
# ======================================
jwt.secret=mySecretKeyForJwtGenerationAndValidation123456
jwt.expiration=86400000

# ======================================
# EUREKA CONFIGURATION
# ======================================
eureka.client.service-url.defaultZone=http://localhost:5050/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.enabled=true

# ======================================
# HRMS - API GATEWAY ROUTES (Direct URLs - No Eureka)
# ======================================

# Attendance Service Routes
spring.cloud.gateway.mvc.routes[0].id=attendance-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8094
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/attendance/**

# Leave Service Routes
spring.cloud.gateway.mvc.routes[1].id=leave-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8093
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/leaves/**

# Payroll Service Routes
