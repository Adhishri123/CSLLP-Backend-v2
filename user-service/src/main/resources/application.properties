# ===============================
# Application Configuration
# ===============================
spring.application.name=user-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:5050/eureka

# ===============================
# DataSource Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/user_service_db
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# OTP Configuration
# ===============================
otp.expiry.minutes=10
otp.max.attempts.per.hour=3
otp.length=6

# ===============================
# Hibernate / JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.configserverllp.csllp_learning_platform.user_service=DEBUG

